<!-- Crie uma função assíncrona chamada getPostData(postId) que faz uma 
requisição à API e retorna os dados do post.
Se a requisição falhar, a função deve exibir um erro no console.
Crie uma página HTML que mostra o conteúdo dos posts. -->

<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exercício 7 - Consulta de Posts</title>
    </head>
    <body>
        <h1>Obter Informação de Post</h1>
        <input type="number" id="postInput" placeholder="Digite o ID do post">
        <button id="fetchBtn">Buscar Conteúdo</button>
        <div id="displayArea"></div>

        <script>
            // Função assíncrona
            const getPostData = async(postId) => { // keyword async p/ declarar que a função é assíncrona, fazendo com que retorne uma Promise.
                try{
                    const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${postId}/`); // await pausa a execução da função até que a Promise retornada pelo fetch() seja resolvida, sem bloquear o restante do navegador.
                    // fetch() é a ferramenta moderna para fazer requisições http.
                    if(!response.ok){ // verificamos se a resposta do servidor foi bem sucedida. se não, lança um erro.
                        throw new Error(`Erro HTTP! Status: ${response.status}`);
                    }

                    const data = await response.json(); // método json() também retorna uma Promise. então, utilizamos await para esperar o corpo da resposta.
                    return data;
                } catch(error){ // tratamento de erros com try/catch
                    console.error('Error fetching user data: ', error);
                }
            };

            // Lógica para mostrar o conteúdo na página HTML
            const btn = document.getElementById('fetchBtn');
            const input = document.getElementById('postInput');
            const display = document.getElementById('displayArea');

            btn.addEventListener('click', async() => {
                const id = input.value;
                const post = await getPostData(id); // ao chamar a função no evento do botão, precisamos usar await novamente pois a resposta não é instantânea.

                if(post){
                    display.innerHTML = `
                        <h3>${post.title}</h3>
                        <p>${post.body}</p>
                    `;
                } else{
                    display.innerHTML = `<p style="color: red;">Erro ao carregar o post.</p>`;
                }
            });
        </script>
    </body>
</html>
